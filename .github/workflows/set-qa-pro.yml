name: Set QA plan
on:
  workflow_dispatch: {}
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert plan QA ke Pro
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@latest >/dev/null 2>&1
          export CLOUDFLARE_API_TOKEN=$CF_API_TOKEN CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT_ID
          wrangler d1 execute clincoo-db --remote --command "INSERT INTO subscription (key, value) VALUES ('u96:plan','Pro'),('u96:start_date','2026-09-16'),('u96:billing_cycle','Bulanan') ON CONFLICT(key) DO UPDATE SET value = excluded.value" 2>&1 | tail -2
