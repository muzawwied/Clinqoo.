name: Diagnose CF Pages

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang wrangler
        run: npm install -g wrangler
      - name: Daftar project Pages
        run: npx wrangler pages project list 2>&1 | head -40
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deployment terakhir project clincoo
        run: npx wrangler pages deployment list --project-name=clincoo 2>&1 | head -15 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deployment terakhir project clincoo-be2
        run: npx wrangler pages deployment list --project-name=clincoo-be2 2>&1 | head -15 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
