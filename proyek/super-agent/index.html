<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinqoo Super Agent</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:28px 18px}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.badge{font-size:12px;border:1px solid #ddd;border-radius:999px;padding:6px 10px}.card{border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0000000a}.roles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.role{background:#f6f6f6;border-radius:999px;padding:7px 10px;font-size:12px}.row{display:flex;gap:10px}.goal{width:100%;min-height:130px;border:1px solid #d1d5db;border-radius:12px;padding:14px;font:inherit;resize:vertical}.btn{margin-top:12px;border:0;border-radius:12px;padding:12px 16px;background:#111;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.status{margin-top:18px;white-space:pre-wrap}.step{padding:10px 0;border-bottom:1px solid #eee}.done{font-size:12px;color:#15803d}.err{color:#b91c1c}.muted{color:#6b7280;font-size:13px}.result{margin-top:14px;padding:14px;background:#f8fafc;border-radius:12px;white-space:pre-wrap;line-height:1.55}@media(max-width:600px){.hero{align-items:flex-start;flex-direction:column}.row{flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<div class="hero"><div><h1>🚀 Clinqoo Super Agent</h1><div class="muted">Strategist → Researcher → Builder → Reviewer → Finalizer</div></div><span class="badge">v2</span></div>
<div class="card"><div class="roles"><span class="role">🧭 Strategist</span><span class="role">🔎 Researcher</span><span class="role">💻 Builder</span><span class="role">🧐 Reviewer</span><span class="role">🏁 Finalizer</span></div>
<textarea id="goal" class="goal" placeholder="Contoh: Bangun landing page SaaS modern untuk produk saya, lengkap dengan struktur halaman, copywriting, CTA, dan rekomendasi implementasi."></textarea>
<button id="run" class="btn">Mulai Super Agent</button><div id="status" class="status muted"></div></div>
</main>
<script>
const api='/api/super-agent';
const qs=new URLSearchParams(location.search); const projectId=qs.get('id')||localStorage.getItem('clinqoo_current_project_id')||'';
const $=id=>document.getElementById(id); let timer=null;
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function start(){
 const goal=$('goal').value.trim(); if(goal.length<3){$('status').textContent='Tulis tujuan minimal 3 karakter.';return}
 $('run').disabled=true; $('status').textContent='Menyiapkan Super Agent…';
 try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start',goal,project_id:projectId||undefined})});const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal memulai');render(d.task);poll(d.task.id)}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>';$('run').disabled=false}
}
async function poll(id){clearInterval(timer);const tick=async()=>{try{const r=await fetch(api+'?task_id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal membaca status');render(d.task,d.events);if(d.task.status==='done'||d.task.status==='failed'){clearInterval(timer);$('run').disabled=false}}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};await tick();timer=setInterval(tick,3000)}
function render(t,events=[]){const plan=Array.isArray(t.plan)?t.plan:[];let h='<b>Status:</b> '+esc(t.status)+'\n';if(plan.length){h+='<div style="margin-top:12px">'+plan.map((p,i)=>'<div class="step">'+(p.done?'✅':'⏳')+' <b>'+esc(p.title)+'</b>'+(p.done?' <span class="done">selesai</span>':'')+'</div>').join('')+'</div>'}if(events.length)h+='<div class="muted" style="margin-top:12px">'+events.slice(-5).map(e=>esc(e.text)).join('\n')+'</div>';if(t.result)h+='<div class="result">'+esc(t.result)+'</div>';if(t.error)h+='<div class="err" style="margin-top:10px">'+esc(t.error)+'</div>';$('status').innerHTML=h}
$('run').onclick=start;
</script></body></html>
