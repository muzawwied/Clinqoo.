    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try { lucide.createIcons(); } catch (e) {}
        });


        
        // ==== KONFIG AUTH ====
        const API_BASE = 'https://clincoo-be2.pages.dev/api/auth';
        const TOKEN_KEY = 'clinqoo_auth_token';
        const GITHUB_CLIENT_ID = 'Ov23ctIBGjQBolR5PS2C';

        function saveSession(data) {
            try {
                localStorage.setItem(TOKEN_KEY, data.token);
                // simpan user lebih dulu -> data profil di bawah otomatis masuk namespace akun
                localStorage.setItem('clinqoo_auth_user', JSON.stringify(data.user || {}));
                localStorage.setItem('clinqoo_fullname', data.user.name || '');
                localStorage.setItem('clinqoo_email', data.user.email || '');
                if (data.user.avatar_url) localStorage.setItem('clinqoo_profile_pic', data.user.avatar_url);
            } catch (e) {}
        }


        // Helper cookie untuk state OAuth (lebih tahan redirect lintas-domain daripada
        // localStorage/sessionStorage di beberapa browser dengan anti bounce-tracking).
        function setOauthStateCookie(val, provider) {
            const payload = encodeURIComponent(JSON.stringify({ v: val, t: Date.now(), p: provider }));
            document.cookie = 'clinqoo_oauth_state=' + payload + '; Max-Age=900; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }
        function getOauthStateCookie() {
            const m = document.cookie.match(/(?:^|;\s*)clinqoo_oauth_state=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : null;
        }
        function clearOauthStateCookie() {
            document.cookie = 'clinqoo_oauth_state=; Max-Age=0; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }

        // ==== LOGIN SOSIAL (OAuth) ====
        // redirect_uri WAJIB persis alamat terdaftar di GitHub OAuth App & Google Console.
        // Halaman auth kini dilayani bersih di /auth/ (auth/index/), tapi callback
        // OAuth tetap diarahkan ke alamat lama yang terdaftar (akun/auth.html), yang
        // kini cuma pengalih ke sini — jadi tidak perlu daftar ulang di Google/GitHub.
        function oauthRedirectUri() {
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                return window.location.origin + window.location.pathname;
            if (location.hostname === 'muzawwied.github.io')
                return 'https://muzawwied.github.io/Clinqoo./akun/auth.html';
            return 'https://clinqoo.pages.dev/auth/';
        }
        function startOAuth(provider) {
            const redirectUri = oauthRedirectUri();
            // State acak per sesi — cegah serangan login-CSRF (callback jahat memaksa
            // korban login ke akun penyerang). Callback harus mengembalikan state ini.
            const st = (crypto.randomUUID ? crypto.randomUUID() : ('s' + Date.now() + Math.random())).replace(/-/g, '');
            // Cookie (bukan localStorage/sessionStorage) — beberapa browser (Samsung
            // Internet, Firefox, Brave) punya fitur anti "bounce tracking" yang otomatis
            // MENGHAPUS localStorage yang baru ditulis persis sebelum redirect ke domain
            // lain (github.com/accounts.google.com), jadi state selalu hilang saat kembali.
            // Cookie SameSite=Lax dikecualikan dari itu karena memang untuk alur ini.
            // Payload menyimpan provider (p) juga -> deteksi provider saat callback,
            // karena state sekarang acak, bukan literal 'github'/'google'.
            setOauthStateCookie(st, provider);
            if (provider === 'github') {
                window.location.href = 'https://github.com/login/oauth/authorize?client_id=' + GITHUB_CLIENT_ID +
                    '&scope=read:user%20user:email%20repo&state=' + st + '&redirect_uri=' + encodeURIComponent(redirectUri);
            } else {
                fetch(API_BASE + '/google')
                    .then(r => r.json())
                    .then(data => {
                        if (!data.client_id) throw new Error(data.error || 'Client ID Google tidak tersedia.');
                        window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + data.client_id +
                            '&redirect_uri=' + encodeURIComponent(redirectUri) +
                            '&response_type=code&scope=openid%20email%20profile&state=' + st + '&prompt=select_account';
                    })
                    .catch(err => showModal('Gagal Memulai Login Google', err.message, 'error'));
            }
        }

        async function handleOAuthCallback(code, provider) {
            const redirectUri = oauthRedirectUri();
            window.history.replaceState({}, document.title, window.location.pathname);
            try {
                const res = await fetch(API_BASE + '/' + provider, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, redirect_uri: redirectUri })
                });
                const data = await res.json();
                if (!res.ok || !data.token) throw new Error(data.error || 'Login ' + provider + ' gagal.');
                saveSession(data);
                setTimeout(() => { window.location.href = '../'; }, 400);
            } catch (err) {
                document.getElementById('oauth-loading').classList.add('hidden');
                showModal('Login ' + (provider === 'github' ? 'GitHub' : 'Google') + ' Gagal', err.message, 'error');
            }
        }

        // Handle callback OAuth & sesi aktif saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const oauthError = params.get('error');
            if (code) {
                // Deteksi provider dari state tersimpan (cookie). Tanpa validasi blokir:
                // selalu lanjut login, tanpa popup pemblokir.
                const savedRaw = getOauthStateCookie();
                let savedProvider = 'github';
                try {
                    const parsed = JSON.parse(savedRaw || 'null');
                    if (parsed && parsed.p === 'google') savedProvider = 'google';
                } catch (e) {}
                clearOauthStateCookie();
                document.getElementById('oauth-loading').classList.remove('hidden');
                handleOAuthCallback(code, savedProvider);
            } else if (oauthError) {
                showModal('Login Dibatalkan', 'Proses login dibatalkan atau gagal. Silakan coba lagi.', 'error');
            }

            // Kalau sesi masih aktif, langsung ke beranda
            (async () => {
                try {
                    const token = localStorage.getItem(TOKEN_KEY);
                    if (!token) return;
                    const res = await fetch(API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (res.ok) {
                        const d = await res.json();
                        if (d.authenticated) window.location.replace('../');
                    } else {
                        localStorage.removeItem(TOKEN_KEY);
                    }
                } catch (e) {}
            })();
        });

                // Fungsi Modal
        function showModal(title, message, type = 'success') {
            var modal = document.getElementById('system-modal');
            if (!modal) return;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            var iconWrap = document.getElementById('modal-icon-wrap');
            var icons = { success: 'check-circle', error: 'alert-circle', info: 'info' };
            var colors = {
                success: 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400',
                error: 'bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400',
                info: 'bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400'
            };
            var t = colors[type] ? type : 'success';
            iconWrap.className = 'w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto ' + colors[t];
            iconWrap.innerHTML = '<i data-lucide="' + icons[t] + '" class="w-6 h-6"></i>';
            try { lucide.createIcons(); } catch (e) {}
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            var modal = document.getElementById('system-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
